spring:
  config:
    import: aws-parameterstore:/team-profile/prod/
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/team_profile
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

management:
  info:
    env:
      enabled: true

info:
  team-name: ${MY_NAME}
