spring:
  config:
    import: aws-parameterstore:/team-profile/prod/
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/team_profile
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  cloud:
    aws:
      s3:
        bucket: team-profile-729049749839-files

cloud:
  aws:
    cloudfront:
      domain: d1o99a9x70rw82.cloudfront.net