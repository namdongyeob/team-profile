spring:
  config:
    import: aws-parameterstore:/team-profile/prod/
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO
    com.example.teamprofile: INFO

management:
  info:
    env:
      enabled: true

info:
  team-name: ${team-name}
