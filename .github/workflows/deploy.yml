name: Deploy Pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          SHORT_SHA=${{ steps.vars.outputs.short_sha }}
          docker build --platform linux/arm64 \
            -t namdongyeob/team-profile:${SHORT_SHA} \
            -t namdongyeob/team-profile:latest .
          docker push namdongyeob/team-profile:${SHORT_SHA}
          docker push namdongyeob/team-profile:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Launch Template with new User Data
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          SCRIPT="#!/bin/bash
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
          docker pull namdongyeob/team-profile:${IMAGE_TAG}
          docker stop team-profile || true
          docker rm team-profile || true
          docker run -d --name team-profile -p 8080:8080 --restart unless-stopped -e SPRING_PROFILES_ACTIVE=prod namdongyeob/team-profile:${IMAGE_TAG}"
          USER_DATA=$(echo "${SCRIPT}" | base64 -w 0)
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${{ vars.LAUNCH_TEMPLATE_ID }} \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)
          aws ec2 modify-launch-template \
            --launch-template-id ${{ vars.LAUNCH_TEMPLATE_ID }} \
            --default-version ${NEW_VERSION}
          echo "✅ Launch Template v${NEW_VERSION} 생성 완료"

      - name: Start Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ vars.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 100, "InstanceWarmup": 120}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "✅ Instance Refresh 시작: ${REFRESH_ID}"

      - name: Wait for Instance Refresh
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ vars.ASG_NAME }} \
              --instance-refresh-ids ${{ steps.refresh.outputs.refresh_id }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "시도 ${i}/30 - 상태: ${STATUS}"
            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ 배포 완료!"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ 배포 실패"
              exit 1
            fi
            sleep 30
          done
          echo "❌ 타임아웃"
          exit 1